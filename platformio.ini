; PaperOS build configuration. See docs/ARCHITECTURE.md and docs/SIMULATOR.md.
;
;   pio run -e sim              build the desktop simulator  (.pio/build/sim/program)
;   pio run -e papers3 -t upload   build + flash the device
;
; Prefer the Makefile targets (make sim, make shot, make flash, ...).

[platformio]
default_envs = sim
src_dir = src
test_dir = tests/unit

[env]
lib_deps =
  m5stack/M5GFX@0.3.0
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -std=gnu++17
  -Wall
  -I src
build_unflags =
  -std=gnu++11
  -std=gnu++14

; ---------------------------------------------------------------- simulator
[env:sim]
platform = native
build_type = debug
build_src_filter = +<*> -<platform/device/> -<apps/_template/>
build_flags =
  ${env.build_flags}
  -O1 -g
  -DPOS_SIM=1
  !sdl2-config --cflags
  !sdl2-config --libs
  -lcurl
  !pkg-config --cflags --libs libsodium

; ---------------------------------------------------------------- host unit tests
; pio test -e test   (make test). Shared code only: no platform/ sources.
[env:test]
extends = env:sim
test_framework = doctest
test_build_src = yes
build_src_filter = +<core/> +<hal/> +<ui/> +<apps/> +<gen/> -<apps/_template/>

; ---------------------------------------------------------------- device
[env:papers3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<platform/sim/> -<apps/_template/>
lib_deps =
  ${env.lib_deps}
  m5stack/M5Unified@0.3.0
build_flags =
  ${env.build_flags}
  -O2
  -DPOS_DEVICE=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
; ESP32-S3R8: 16 MB quad flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; Patches M5GFX in .pio/libdeps before the build (docs/DECISIONS.md D24): faster frame buffer writes, same pixels.
extra_scripts = pre:tools/patch_m5gfx.py
; ESP-IDF settings (D24, D25): the Arduino core and its ESP-IDF libraries are rebuilt from source with these (pioarduino
; "hybrid compile"; the first build after a change takes long). Everything PSRAM-bound (canvas, diff, push) gains from a
; bigger data cache with longer lines. PSRAM must be up before C++ global constructors (Os and its 518 KB buffers are
; globals): without SPIRAM_BOOT_INIT the rebuilt core boot-looped in DisplayManager's constructor (2026-11-16).
custom_sdkconfig =
  CONFIG_SPIRAM_BOOT_HW_INIT=y
  CONFIG_SPIRAM_BOOT_INIT=y
  CONFIG_ESP32S3_DATA_CACHE_64KB=y
  # CONFIG_ESP32S3_DATA_CACHE_32KB is not set
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  # CONFIG_ESP32S3_DATA_CACHE_LINE_32B is not set
board_build.filesystem = littlefs
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
