; PaperOS build configuration. See docs/ARCHITECTURE.md and docs/SIMULATOR.md.
;
;   pio run -e sim              build the desktop simulator  (.pio/build/sim/program)
;   pio run -e papers3 -t upload   build + flash the device
;
; Prefer the Makefile targets (make sim, make shot, make flash, ...).

[platformio]
default_envs = sim
src_dir = src
test_dir = tests/unit

[env]
lib_deps =
  m5stack/M5GFX@0.3.0
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -std=gnu++17
  -Wall
  -I src
build_unflags =
  -std=gnu++11
  -std=gnu++14

; ---------------------------------------------------------------- simulator
[env:sim]
platform = native
build_type = debug
build_src_filter = +<*> -<platform/device/> -<apps/_template/>
build_flags =
  ${env.build_flags}
  -O1 -g
  -DPOS_SIM=1
  !sdl2-config --cflags
  !sdl2-config --libs
  -lcurl
  !pkg-config --cflags --libs libsodium

; ---------------------------------------------------------------- host unit tests
; pio test -e test   (make test). Shared code only: no platform/ sources.
[env:test]
extends = env:sim
test_framework = doctest
test_build_src = yes
build_src_filter = +<core/> +<hal/> +<ui/> +<apps/> +<gen/> -<apps/_template/>

; ---------------------------------------------------------------- device
[env:papers3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<platform/sim/> -<apps/_template/>
lib_deps =
  ${env.lib_deps}
  m5stack/M5Unified@0.3.0
build_flags =
  ${env.build_flags}
  ; The Arduino build script adds its own -Os after these flags and the last one wins: the "-O2" that stood here until
  ; 2026-11-16 never had an effect. Real -O2 would need -Os in build_unflags (and costs flash).
  -Os
  -fno-exceptions
  -DPOS_DEVICE=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Arduino core and library messages: errors only (D31; 3 brings their warnings and info lines back, +20 KB). POS_LOG is not affected.
  -DCORE_DEBUG_LEVEL=1
; ESP-IDF is built without C++ exceptions (custom_sdkconfig below, D31); the Arduino build script still passes -fexceptions.
build_unflags =
  ${env.build_unflags}
  -fexceptions
; ESP32-S3R8: 16 MB quad flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
; 120 MHz flash and PSRAM (D25, the user chose to try it, 2026-11-16): ESP-IDF times 120 MHz octal PSRAM only with 120 MHz
; flash. pioarduino derives the PSRAM speed from this and enables experimental features and flash HPM for > 80 MHz.
board_build.f_flash = 120000000L
; The image header (what the ROM boots with) stays at 80 MHz: esptool accepts no 120m for the ESP32-S3; ESP-IDF switches to
; 120 MHz after boot.
board_build.f_image = 80000000L
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; Patches M5GFX in .pio/libdeps before the build (docs/DECISIONS.md D24): faster frame buffer writes, same pixels.
extra_scripts = pre:tools/patch_m5gfx.py
; ESP-IDF settings (D24, D25): the Arduino core and its ESP-IDF libraries are rebuilt from source with these (pioarduino
; "hybrid compile"; the first build after a change takes long). Everything PSRAM-bound (canvas, diff, push) gains from a
; bigger data cache with longer lines. PSRAM must be up before C++ global constructors (Os and its 518 KB buffers are
; globals): without SPIRAM_BOOT_INIT the rebuilt core boot-looped in DisplayManager's constructor (2026-11-16).
custom_sdkconfig =
  CONFIG_SPIRAM_BOOT_HW_INIT=y
  CONFIG_SPIRAM_BOOT_INIT=y
  CONFIG_ESP32S3_DATA_CACHE_64KB=y
  # CONFIG_ESP32S3_DATA_CACHE_32KB is not set
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  # CONFIG_ESP32S3_DATA_CACHE_LINE_32B is not set
  ; the temperature-based PSRAM re-tuning fails at boot on this chip (ESP_ERR_NOT_SUPPORTED, abort), 2026-11-16
  CONFIG_SPIRAM_TIMING_TUNING_POINT_VIA_TEMPERATURE_SENSOR=n
  ; Memory (D27): ordinary allocations go to PSRAM (strings, vectors, chapter text, word lists: they took the internal RAM
  ; Wi-Fi and TLS need); FreeRTOS objects, stacks and DMA buffers ask for internal RAM explicitly and keep getting it, from a
  ; 32 KB reserve. mbedTLS buffers in PSRAM. Core dumps off (no partition for them: every boot logged a failed write).
  CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=0
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
  CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
  CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=y
  CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=n
  ; Flash size (D31): nothing here throws or catches (a throw already ended in abort), so no C++ exception support and no
  ; unwind tables; the 44 common root certificates instead of all 150 (Let's Encrypt, Google, DigiCert, Amazon, Sectigo,
  ; GoDaddy, GlobalSign: a server under another root fails TLS verification); TLS client only; no SoftAP, no WPA2/3
  ; Enterprise (the device is a station on a home network); no table of ESP-IDF error names. IPv6 stays: without it
  ; ESP-IDF's own lwIP port and the esp-modbus component do not compile (tried 2026-11-16).
  CONFIG_COMPILER_CXX_EXCEPTIONS=n
  CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=y
  CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=n
  CONFIG_MBEDTLS_TLS_CLIENT_ONLY=y
  CONFIG_MBEDTLS_TLS_SERVER_AND_CLIENT=n
  CONFIG_ESP_WIFI_SOFTAP_SUPPORT=n
  CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
  CONFIG_ESP_ERR_TO_NAME_LOOKUP=n
  ; No mbedTLS error texts (a TLS failure logs its number); a failed assert prints only its program address, not the
  ; expression, file and function (decode: xtensa-esp32s3-elf-addr2line -pfiaC -e .pio/build/papers3/firmware.elf 0x42...).
  CONFIG_MBEDTLS_ERROR_STRINGS=n
  CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
  CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE=n
board_build.filesystem = littlefs
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
