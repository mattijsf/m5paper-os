# PaperOS inbox feeds for Home Assistant.  DRAFT: not tested against a live instance yet.
# Task P6-1 in docs/ROADMAP.md tests and installs it. Contract: docs/BACKEND.md "Inbox feeds".
#
# Install: copy to <home-assistant config>/packages/paperos_inbox.yaml (that repo goes live on
# push: follow its rules). Replace the two phone sensor ids if yours differ.
#
# Phone: Home Assistant app > Settings > Companion app > Manage sensors > Notification sensors:
# enable "Last notification" and "Last removed notification", allow list com.whatsapp and your
# mail app for both.

recorder:
  exclude:
    entities:
      - sensor.paperos_whatsapp_inbox
      - sensor.paperos_mail_inbox

template:
  # ---------------------------------------------------------------- WhatsApp
  - trigger:
      - trigger: state
        entity_id: sensor.pixel_9_pro_last_notification
        id: posted
      - trigger: state
        entity_id: sensor.pixel_9_pro_last_removed_notification
        id: removed
      - trigger: event
        event_type: paperos_inbox_clear
        event_data:
          feed: whatsapp
        id: clear
    sensor:
      - name: PaperOS WhatsApp inbox
        unique_id: paperos_whatsapp_inbox
        icon: mdi:message-text
        state: "{{ now().timestamp() | int }}"
        attributes:
          updated: "{{ now().isoformat() }}"
          items: >
            {% set old = this.attributes.get('items', []) if this is defined and this.attributes is defined else [] %}
            {% if trigger.id == 'clear' %}
              {{ [] }}
            {% else %}
              {% set a = trigger.to_state.attributes %}
              {% set title = a.get('android.title', '') | string %}
              {% set is_ours = a.get('package') == 'com.whatsapp' and title not in ['', 'WhatsApp'] %}
              {% if not is_ours %}
                {{ old }}
              {% else %}
                {% set parts = title.split(': ', 1) %}
                {% set chat = parts[0] if parts | count > 1 else '' %}
                {% set sender = parts[1] if parts | count > 1 else parts[0] %}
                {% if trigger.id == 'removed' %}
                  {# the user opened or dismissed this chat on the phone: drop its items #}
                  {% if chat != '' %}
                    {{ old | rejectattr('chat', 'eq', chat) | list }}
                  {% else %}
                    {{ old | rejectattr('from', 'eq', sender) | list }}
                  {% endif %}
                {% else %}
                  {% set item = {
                    'id': a.get('post_time', now().timestamp() | int) | string,
                    'from': sender,
                    'chat': chat,
                    'text': (a.get('android.text', trigger.to_state.state) | string)[:500],
                    'ts': now().timestamp() | int
                  } %}
                  {{ ([item] + (old | rejectattr('id', 'eq', item.id) | list))[:25] }}
                {% endif %}
              {% endif %}
            {% endif %}

  # ---------------------------------------------------------------- Mail
  - trigger:
      - trigger: state
        entity_id: sensor.pixel_9_pro_last_notification
        id: posted
      - trigger: state
        entity_id: sensor.pixel_9_pro_last_removed_notification
        id: removed
      - trigger: event
        event_type: paperos_inbox_clear
        event_data:
          feed: mail
        id: clear
    sensor:
      - name: PaperOS Mail inbox
        unique_id: paperos_mail_inbox
        icon: mdi:email
        state: "{{ now().timestamp() | int }}"
        attributes:
          updated: "{{ now().isoformat() }}"
          items: >
            {% set mail_apps = ['ch.protonmail.android', 'com.google.android.gm'] %}
            {% set old = this.attributes.get('items', []) if this is defined and this.attributes is defined else [] %}
            {% if trigger.id == 'clear' %}
              {{ [] }}
            {% else %}
              {% set a = trigger.to_state.attributes %}
              {% set title = a.get('android.title', '') | string %}
              {% if a.get('package') not in mail_apps or title == '' %}
                {{ old }}
              {% elif trigger.id == 'removed' %}
                {{ old | rejectattr('id', 'eq', a.get('post_time', '') | string) | list }}
              {% else %}
                {% set item = {
                  'id': a.get('post_time', now().timestamp() | int) | string,
                  'from': title,
                  'chat': '',
                  'text': (a.get('android.text', trigger.to_state.state) | string)[:500],
                  'ts': now().timestamp() | int
                } %}
                {{ ([item] + (old | rejectattr('id', 'eq', item.id) | list))[:25] }}
              {% endif %}
            {% endif %}
