# PaperOS inbox feeds for Home Assistant.  DRAFT: not tested against a live instance yet.
# Tasks P6-1..P6-3 in docs/ROADMAP.md test and install it. Contract: docs/BACKEND.md "Inbox feeds".
#
# Needs (set up in the Home Assistant UI first):
#   - "WhatsApp for Home Assistant" add-on + integration (events whatsapp_message_received/_sent)
#   - IMAP integration pointed at Proton Mail Bridge (event imap_content), text enabled
#
# Install: copy to <home-assistant config>/packages/paperos_inbox.yaml. That repo goes live on
# push: follow its rules. Replace IMAP_UNREAD_SENSOR below with the real entity id.
#
# Field names of the WhatsApp events come from the add-on docs; verify them against real
# events (Developer tools > Events) before trusting the templates, especially for groups.

recorder:
  exclude:
    entities:
      - sensor.paperos_whatsapp_inbox
      - sensor.paperos_mail_inbox

script:
  paperos_inbox_clear:
    alias: PaperOS inbox clear
    fields:
      feed:
        description: whatsapp or mail
    sequence:
      - event: paperos_inbox_clear
        event_data:
          feed: "{{ feed }}"

template:
  # ---------------------------------------------------------------- WhatsApp
  - trigger:
      - trigger: event
        event_type: whatsapp_message_received
        id: received
      - trigger: event
        event_type: whatsapp_message_sent
        id: sent
      - trigger: event
        event_type: paperos_inbox_clear
        event_data:
          feed: whatsapp
        id: clear
    sensor:
      - name: PaperOS WhatsApp inbox
        unique_id: paperos_whatsapp_inbox
        icon: mdi:message-text
        state: "{{ now().timestamp() | int }}"
        attributes:
          updated: "{{ now().isoformat() }}"
          items: >
            {% set max_age = 48 * 3600 %}
            {% set t = now().timestamp() | int %}
            {% set old = (this.attributes.get('items', []) if this is defined and this.attributes is defined else [])
                         | selectattr('ts', 'gt', t - max_age) | list %}
            {% if trigger.id == 'clear' %}
              {{ [] }}
            {% elif trigger.id == 'sent' %}
              {# the user answered in this chat (from the phone too): it is no longer unread #}
              {% set d = trigger.event.data %}
              {{ old | rejectattr('key', 'eq', d.get('group_id') or d.get('to') or d.get('recipient')) | list }}
            {% else %}
              {% set d = trigger.event.data %}
              {% set text = d.get('content', '') | string %}
              {% if d.get('type') != 'chat' or text == '' %}
                {{ old }}
              {% else %}
                {% set jid = d.get('sender', '') | string %}
                {% set item = {
                  'id': (d.get('timestamp', t) | string) ~ '-' ~ (d.get('sender_number', '') | string),
                  'from': d.get('sender_name') or d.get('sender_number', '?'),
                  'chat': d.get('group_name', '') if jid.endswith('@g.us') else '',
                  'text': text[:500],
                  'ts': d.get('timestamp', t) | int,
                  'key': jid
                } %}
                {{ ([item] + (old | rejectattr('id', 'eq', item.id) | list))[:30] }}
              {% endif %}
            {% endif %}

  # ---------------------------------------------------------------- Mail (Proton via Bridge + IMAP)
  - trigger:
      - trigger: event
        event_type: imap_content
        id: mail
      - trigger: state
        entity_id: sensor.IMAP_UNREAD_SENSOR
        to: "0"
        id: allread
      - trigger: event
        event_type: paperos_inbox_clear
        event_data:
          feed: mail
        id: clear
    sensor:
      - name: PaperOS Mail inbox
        unique_id: paperos_mail_inbox
        icon: mdi:email
        state: "{{ now().timestamp() | int }}"
        attributes:
          updated: "{{ now().isoformat() }}"
          items: >
            {% set old = this.attributes.get('items', []) if this is defined and this.attributes is defined else [] %}
            {% if trigger.id in ['clear', 'allread'] %}
              {{ [] }}
            {% else %}
              {% set d = trigger.event.data %}
              {% if not d.get('initial', true) %}
                {{ old }}
              {% else %}
                {% set item = {
                  'id': d.get('uid', '') | string,
                  'from': d.get('sender', '?') | string,
                  'chat': '',
                  'subject': (d.get('subject', '') | string)[:200],
                  'text': (d.get('text', '') | string)[:1500],
                  'ts': as_timestamp(d.get('date'), now().timestamp()) | int,
                  'key': d.get('entry_id', '') | string
                } %}
                {{ ([item] + (old | rejectattr('id', 'eq', item.id) | list))[:20] }}
              {% endif %}
            {% endif %}
