# PaperOS inbox (repo m5paper-os, docs/BACKEND.md "Inbox feeds", DECISIONS.md D22).
#
# Since 2026-11-16 Home Assistant is not trusted with message text (D22): the WhatsApp Gateway add-on, its
# `whatsapp` integration and the Proton Mail Bridge add-on are removed, and with them the WhatsApp feed, the
# guarded send script (script.paperos_whatsapp_send), its rate-limit sensor and the IMAP mail feed.
#
# What comes next (ROADMAP.md Phase 6): a companion Android app on the phone reads the WhatsApp and Proton Mail
# notifications, encrypts each one for the PaperOS device (authenticated, end to end), and posts only the
# ciphertext to Home Assistant. A relay sensor here will store and forward those blobs; it is added by the
# relay task once the protocol is fixed. Home Assistant never sees plaintext and holds no send rules: those
# live in the phone app.
#
# Kept for that relay:
# - script.paperos_inbox_clear: "Mark all read" on the device calls it (a service call works for a
#   non-admin user; firing events does not). Today nothing listens to its event.
# - the recorder exclusion of the two feed entity ids, so whatever fills them later never reaches the history
#   database.

recorder:
  exclude:
    entities:
      - sensor.paperos_whatsapp_inbox
      - sensor.paperos_mail_inbox

script:
  paperos_inbox_clear:
    alias: PaperOS inbox clear
    description: Empties a PaperOS inbox feed ("Mark all read" on the device).
    fields:
      feed:
        description: whatsapp or mail
        example: whatsapp
      before:
        description: >
          Optional unix time. Only items with ts <= before are dropped (what the device had shown when "Mark all read" was tapped);
          newer messages stay. Without it, or 0, the whole feed is cleared.
        required: false
        example: 1768480000
    sequence:
      - event: paperos_inbox_clear
        event_data:
          feed: "{{ feed }}"
          before: "{{ before | default(0) | int(0) }}"
